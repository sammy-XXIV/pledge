<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pledge App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
/* Two fonts only: Bebas Neue for titles and numbers, Inter for everything else. */
h3,.logo,.pill,.eyebrow,.tag{font-family:Inter,system-ui,sans-serif}
:root{--glass:rgba(43,89,255,.08);--hair:rgba(255,255,255,.07);--hover:rgba(43,89,255,.16)}
body{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

[hidden]{display:none!important}

/* sidebar */
aside.nav{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:32px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.logo{font-weight:700;letter-spacing:.08em;font-size:18px}
.menu{display:grid;gap:8px}
.menu a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:14px}
.menu a:hover{color:#fff;background:var(--glass)}
.menu a.on{color:#fff;background:rgba(43,89,255,.22)}
.menu a .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.menu a .cnt.todo{background:var(--blue);color:#fff;border-radius:999px;padding:0 8px;font-weight:700}
.net{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--muted)}
.net .src{display:flex;align-items:center;gap:8px;padding:0 4px}
.net code{color:#fff}
.net a.lnk{color:var(--blue);padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.dot.sample{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.pill.ghost{justify-content:center;border:0;background:var(--glass);padding:8px 16px}
.pill.ghost:hover{background:var(--hover)}

/* main */
main{padding:32px 40px 80px;min-width:0}
.page{max-width:1040px}
.top{margin-bottom:32px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
h1{margin:0;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(40px,4.4vw,56px);line-height:1;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:16px}
.tagchip{font:600 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--glass);border-radius:999px;padding:6px 12px}
.top p{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:620px}
h2{font:600 12px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:40px 0 16px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:16px;display:inline-block;text-decoration:none}
.crumb:hover{color:#fff}

/* surfaces: one panel, hairline dividers, no outlines */
.panel{background:var(--glass);border-radius:16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(5,1fr)}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stat{padding:16px 24px}
.stat+.stat{border-left:1px solid var(--hair)}
.stat b{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card2{background:var(--glass);border-radius:16px;padding:24px;display:grid;gap:12px;align-content:start}
.card2 h3{margin:0;font-size:18px;font-weight:600}
.card2 p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.banner{border-radius:14px;background:rgba(43,89,255,.18);padding:14px 20px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px}
.banner b{font-weight:600}

.r{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 150px 200px;gap:16px;align-items:center;width:100%;padding:12px 24px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font-size:14px}
.r+.r,.hd+.r{border-top:1px solid var(--hair)}
.r:hover,.r:focus-visible{background:var(--hover)}
.r.hd{cursor:default;padding-top:16px;padding-bottom:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.r.hd:hover{background:none}
.r.hd+.r{border-top:0}
.who{display:flex;align-items:center;gap:16px;min-width:0}
.who .av{width:32px;height:32px;border-radius:8px}
.two{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.two b{font-weight:500}
.two small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt b{font-variant-numeric:tabular-nums}
.due{justify-self:end;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sd{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#fff}
.sd i{width:8px;height:8px;border-radius:50%;flex:none}
.sd.s-Paid i{background:var(--blue)}
.sd.s-Active i{box-shadow:inset 0 0 0 2px var(--blue)}
.sd.s-Committed i{box-shadow:inset 0 0 0 2px #fff}
.sd.s-Slashed i{background:#fff}
.sd.s-Open i,.sd.s-Cancelled i{background:var(--muted)}
.flag{display:inline-block}
.empty{padding:32px 24px;color:var(--muted);font-size:14px}
.note-r{font-size:12px;color:var(--muted);padding:12px 24px;border-top:1px solid var(--hair)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:0;border-radius:999px;background:var(--glass);padding:8px 16px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip:hover{color:#fff;background:var(--hover)}
.chip.on{background:var(--blue);color:#fff}
.clear{color:var(--blue)}

/* agents */
.ag{grid-template-columns:minmax(0,1.7fr) 130px 110px minmax(0,.8fr) 90px}
.ag .n{font-family:"Bebas Neue",Impact,sans-serif;font-size:28px;line-height:1}
.ag .sc b{font-family:"Bebas Neue",Impact,sans-serif;font-size:28px;font-weight:400;line-height:1}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--blue)}.bar .no{background:#fff}
.find{display:flex;gap:8px;margin-bottom:16px;max-width:520px}
.find input{flex:1;background:var(--glass);border:0;border-radius:12px;padding:10px 14px;color:#fff;font:500 14px Inter,sans-serif}
.find input:focus{outline:2px solid var(--blue)}
.mine-tag{font:700 10px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:var(--blue);color:#fff;border-radius:999px;padding:3px 8px;margin-left:8px;vertical-align:middle}

/* agent profile */
.prof{display:flex;gap:24px;align-items:center;margin-bottom:32px;flex-wrap:wrap}
.prof .av{width:72px;height:72px;border-radius:18px}
.prof .info{flex:1;min-width:240px}
.prof h1{font-size:clamp(36px,4vw,52px)}
.prof .desc{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.5;max-width:640px}
.prof .meta{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.prof .meta code{color:#fff}
.score-big b{font-size:44px}

/* my activity + todo rows */
.todo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 24px}
.todo+.todo{border-top:1px solid var(--hair)}
.todo .tx{display:grid;gap:2px;min-width:0}
.todo .tx b{font-weight:500;font-size:14px}
.todo .tx small{color:var(--muted);font-size:12px}

/* drawer */
.kv.text{padding-bottom:4px}.kv.text p{margin:0;padding:0 16px 12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;z-index:20}
#veil.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:rgba(5,7,13,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transform:translateX(100%);z-index:21;overflow-y:auto;padding:32px 24px}
#drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.dhead h3{margin:0;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:36px;letter-spacing:.02em;text-transform:uppercase;margin-right:auto;line-height:1}
.x{border:0;border-radius:10px;background:var(--glass);width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.x:hover{background:var(--hover)}
.kv{background:var(--glass);border-radius:14px;margin-bottom:16px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;font-size:13px}
.kv div+div{border-top:1px solid var(--hair)}
.kv span{color:var(--muted)}
.kv code{word-break:break-all;text-align:right}
.next{border-radius:14px;padding:16px;background:rgba(43,89,255,.18);font-size:14px}
.next b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-bottom:8px;font-weight:600}
.next code{display:block;margin-top:8px;padding:8px 12px;border-radius:8px;background:#000;color:#fff}
.chip:focus-visible,.r:focus-visible,.menu a:focus-visible,.x:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:10px 16px;font:600 14px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:#fff;color:#000}
.btn.ghost{background:var(--glass);color:#fff}.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
.act{display:grid;gap:12px;margin:0 0 16px;background:var(--glass);border-radius:14px;padding:16px}
.act .h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.field{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{background:#000;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;color:#fff;font:500 14px/1.4 Inter,sans-serif;width:100%;box-sizing:border-box}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.field small{color:var(--muted);font-size:12px;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#fff;background:#000;border-radius:10px;padding:10px 12px;cursor:pointer}
.radios input{margin-top:3px;accent-color:#2B59FF;width:auto;padding:0;border:0;background:none;flex:none}
.radios small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.tpls{display:flex;gap:8px;flex-wrap:wrap}
.sum{border-radius:14px;padding:14px 16px;background:rgba(43,89,255,.18);font-size:13px;line-height:1.55;display:grid;gap:6px}
.sum b{font-weight:600}
.sum .warn{color:#fff;background:#000;border-radius:8px;padding:8px 10px}
details.adv{background:var(--glass);border-radius:14px;padding:12px 16px}
details.adv summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.adv .act{margin:12px 0 0;padding:0;background:none}
.net .btn{width:100%}
#toast{position:fixed;left:256px;bottom:24px;z-index:40;display:grid;gap:8px;width:min(400px,calc(100% - 280px));pointer-events:none}
.toast{background:rgba(5,7,13,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:12px;padding:12px 16px;font-size:13px;box-shadow:inset 3px 0 0 var(--blue)}
.toast.err{box-shadow:inset 3px 0 0 #fff}
.toast code{color:var(--blue)}

@media (max-width:900px){
  body{grid-template-columns:1fr}
  aside.nav{position:static;height:auto;flex-direction:row;align-items:center;gap:16px;padding:16px}
  .menu{display:flex;flex:1;overflow-x:auto}.menu a .cnt{display:none}.menu a .cnt.todo{display:inline}.net{display:none}
  main{padding:24px 16px 64px}
  #toast{left:16px;width:calc(100% - 32px)}
  .stats,.stats.four{grid-template-columns:repeat(2,1fr)}.stat:nth-child(odd){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--hair)}
  .cards{grid-template-columns:1fr}
  .r{grid-template-columns:1fr auto;grid-template-areas:"w s" "a d";row-gap:8px}
  .r>:nth-child(1){grid-area:w}.r>:nth-child(2){grid-area:a}.r>:nth-child(3){grid-area:s;justify-self:end}.r>:nth-child(4){grid-area:d}
  .r.hd{display:none}
  .ag{grid-template-columns:1fr auto;grid-template-areas:"w h" "s s2";row-gap:8px}
  .ag>:nth-child(1){grid-area:w}.ag>:nth-child(2){grid-area:s}.ag>:nth-child(3){grid-area:s2;justify-self:end}.ag>:nth-child(4){display:none}.ag>:nth-child(5){grid-area:h}
  .todo{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside class="nav">
  <a class="logo" id="home" href="index.html">PLEDGE</a>
  <nav class="menu" id="menu"></nav>
  <div class="net" id="net"></div>
</aside>
<main><div class="page" id="view"></div></main>
<div id="veil"></div>
<aside id="drawer" aria-label="Details"></aside>
<div id="toast" role="status" aria-live="polite"></div>

<script src="shared.js"></script>
<script>
const { $, load, avatar, svg, countdown, seedSpans, link, short, CFG, esc } = P;
$("home").href = link("index.html");
const S = { data: { jobs: [], agents: [], source: "sample" }, view: "overview", param: null, filter: "all", role: "buyer",
            open: null, sig: "", meta: {}, stats: {}, extra: [], mine: [], hireAgent: null };
const TABS = [["overview", "Overview", "grid"], ["agents", "Agents", "users"], ["jobs", "Jobs", "list"], ["my", "My activity", "wallet"]];
const now = () => Math.floor(Date.now() / 1000);
const isLate = (j) => j.state === "Active" && j.deadline < now();
const canClaim = (j) => j.state === "Committed" && now() > j.committedAt + j.judgeWindow;
const needsAttn = (j) => isLate(j) || canClaim(j);
const sample = () => S.data.source === "sample";
const num = (x) => Number(x);
const fmtMon = (v) => { const n = Number(v); return n === 0 ? "0" : n < 0.000001 ? "<0.000001" : n >= 1 ? n.toFixed(2).replace(/\.?0+$/, "") : String(+n.toPrecision(3)); };
const fmtDur = (s) => (s % 86400 === 0 ? `${s / 86400} d` : s % 3600 === 0 ? `${s / 3600} h` : s % 60 === 0 ? `${s / 60} min` : `${s} s`);
const ckAddr = (a) => { try { return ethers.getAddress(a); } catch { return a; } };

// ---- wallet + contract writes (any injected EIP-1193 wallet, e.g. MetaMask)
const WRITE_ABI = [
  "function create(uint256 agentId, address judge, uint64 deadline, uint256 minBond, uint32 judgeWindow, string spec) payable returns (uint256)",
  "function accept(uint256 jobId) payable", "function commit(uint256 jobId, bytes32 resultHash, string resultURI)",
  "function confirm(uint256 jobId)", "function reject(uint256 jobId)", "function slash(uint256 jobId)",
  "function claim(uint256 jobId)", "function cancel(uint256 jobId)", "function withdraw()",
  "function credits(address) view returns (uint256)",
];
const MONAD = { chainId: "0x279f", chainName: "Monad Testnet", nativeCurrency: { name: "MON", symbol: "MON", decimals: 18 }, rpcUrls: [CFG.RPC] };
const RP = P.provider; // shared, rate-limit aware
const W = { addr: null, signer: null, credit: 0n, bal: null };
const me = (a) => !!(W.addr && a && a.toLowerCase() === W.addr);

function toast(msg, err) {
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : ""); el.innerHTML = msg;
  const box = $("toast"); box.appendChild(el); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 7000);
}
// agents the user registered or added from this browser (ERC-8004 has no owner enumeration and the RPC caps log ranges)
const lsKey = () => "pledge.agents." + W.addr;
function loadMine() { try { S.mine = JSON.parse(localStorage.getItem(lsKey()) || "[]").map(num).filter(Number.isFinite); } catch { S.mine = []; } }
function saveMine(id) { if (!S.mine.includes(id)) S.mine.push(id); try { localStorage.setItem(lsKey(), JSON.stringify(S.mine)); } catch {} }

async function connect() {
  if (!CFG.ADDRESS) return toast("Sample data has no contract. Open the app without an empty ?addr= to use the live one.", true);
  if (!window.ethereum) return toast("No wallet found. Install MetaMask or another browser wallet.", true);
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    if (parseInt(await window.ethereum.request({ method: "eth_chainId" }), 16) !== 10143) {
      try { await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: MONAD.chainId }] }); }
      catch (e) { if (e.code !== 4902) throw e; await window.ethereum.request({ method: "wallet_addEthereumChain", params: [MONAD] }); }
    }
    W.signer = await new ethers.BrowserProvider(window.ethereum).getSigner();
    W.addr = (await W.signer.getAddress()).toLowerCase();
    loadMine();
    toast(`Wallet connected <code>${short(ckAddr(W.addr))}</code>`);
    await refresh();
  } catch (e) { toast("Connect failed: " + esc(e.shortMessage || e.message), true); }
}
async function refresh() {
  S.data = await load();
  if (W.addr) {
    const c = new ethers.Contract(CFG.ADDRESS, WRITE_ABI, RP);
    W.credit = await c.credits(W.addr);
    W.bal = Number(ethers.formatEther(await RP.getBalance(W.addr)));
  }
  render();
  ensureMeta(); // agent names, owners and scores arrive without blocking the page
}
let metaBusy = false;
function universe() { return [...new Set([...S.data.agents.map((a) => a.id), ...S.mine, ...S.extra])]; }
async function ensureMeta() {
  if (metaBusy || sample()) return; metaBusy = true;
  try {
    const need = universe().filter((id) => !S.meta[id]);
    await P.chunked(need.map((id) => async () => { S.meta[id] = await P.agentMeta(id); }), 3);
    const noStats = universe().filter((id) => !S.data.agents.some((a) => a.id === id) && !S.stats[id]);
    await P.chunked(noStats.map((id) => async () => { S.stats[id] = await P.agentStats(id); }), 2);
    if (need.length || noStats.length) render();
  } catch {} finally { metaBusy = false; }
}
async function send(label, fn, btn) {
  if (!W.signer) return connect();
  const c = new ethers.Contract(CFG.ADDRESS, WRITE_ABI, W.signer);
  if (btn) btn.disabled = true;
  try {
    toast(`${label}: confirm in your wallet`);
    const tx = await fn(c);
    toast(`${label}: sent <code>${short(tx.hash)}</code>`);
    const r = await tx.wait();
    toast(`${label}: confirmed in block ${r.blockNumber}`);
    await refresh().catch(() => setTimeout(() => refresh().catch(() => {}), 1500)); // a read hiccup is not a failed transaction
    return r;
  } catch (e) { toast(`${label} failed: ${esc(e.shortMessage || e.reason || e.message)}`, true); if (btn) btn.disabled = false; }
}

// ---- agents
function agentInfo(id) {
  const m = S.meta[id] || {}, base = S.data.agents.find((a) => a.id === id) || S.stats[id] || { completed: 0, slashed: 0, score: null };
  const jobs = S.data.jobs.filter((j) => j.agentId === id);
  return {
    id, name: m.name || `Agent #${id}`, description: m.description || "", owner: m.owner || "", endpoint: m.endpoint || "",
    exists: m.ok !== false, loaded: !!S.meta[id], completed: base.completed, slashed: base.slashed, score: base.score, jobs,
    volume: jobs.filter((j) => j.state === "Paid").reduce((n, j) => n + Number(j.payment), 0), mine: me(m.owner),
  };
}
const ownedIds = () => (W.addr ? universe().filter((id) => me(S.meta[id]?.owner)) : []);
const scoreTxt = (a) => (a.score ? `${a.score.value} / 100` : "—");
const scoreSub = (a) => (a.score ? `${a.score.count} review${a.score.count === 1 ? "" : "s"} by Pledge` : "no reviews yet");

// ---- what needs the connected wallet to act
function todos() {
  if (!W.addr || sample()) return [];
  const out = [], t = now();
  for (const j of S.data.jobs) {
    const owner = S.meta[j.agentId]?.owner;
    if (j.state === "Open" && j.deadline > t && me(owner)) out.push({ j, cta: "Accept", text: "A buyer is waiting for your agent to accept this job" });
    if (j.state === "Active" && me(j.agent) && !isLate(j)) out.push({ j, cta: "Commit", text: "Do the work and commit the result before the deadline" });
    if (isLate(j) && me(j.buyer)) out.push({ j, cta: "Slash", text: "The agent missed its deadline: take back your payment plus its bond" });
    if (j.state === "Committed" && me(j.judge) && !canClaim(j)) out.push({ j, cta: "Review", text: "A result is waiting for your confirm or reject" });
    if (canClaim(j) && me(j.agent)) out.push({ j, cta: "Claim", text: "The judge did not answer in time: claim payment plus your bond" });
  }
  return out;
}

// ---- job actions (drawer)
function actions(j) {
  if (!CFG.ADDRESS) return "";
  if (!W.addr) return '<div class="act"><span class="h">Take action</span><button class="btn" data-act="connect">Connect wallet</button></div>';
  const out = [], owner = S.meta[j.agentId]?.owner;
  if (j.state === "Open") {
    if (me(owner)) {
      const notes = [];
      if (j.buyer.toLowerCase() === j.judge.toLowerCase()) notes.push("The buyer is also the judge, so they alone decide whether your work counts. Only accept jobs from buyers you trust.");
      if (j.deadline - now() > 86400) notes.push("The deadline is more than a day away; your bond stays locked until you commit.");
      if (me(j.buyer) || me(j.judge)) notes.push("You own this agent and are also the buyer or judge, so this job will not count toward its reputation.");
      out.push(`<label class="field">Bond (MON), at least ${esc(j.minBond)}<input id="f-bond" value="${Math.max(Number(j.minBond), Number(j.payment) / 2)}"></label>${notes.map((n) => `<div class="sum"><span class="warn">${esc(n)}</span></div>`).join("")}<button class="btn" data-act="accept">Accept with bond</button>`);
    }
    if (me(j.buyer)) out.push('<button class="btn ghost" data-act="cancel">Cancel job and get a refund</button>');
  } else if (isLate(j)) out.push('<button class="btn" data-act="slash">Slash bond to buyer</button>');
  else if (j.state === "Active" && me(j.agent)) out.push('<label class="field">Result<textarea id="f-result" rows="3">Done: see summary.</textarea></label><button class="btn" data-act="commit">Commit result</button>');
  if (j.state === "Committed" && me(j.judge)) out.push('<div class="row2"><button class="btn" data-act="confirm">Confirm, pay agent</button><button class="btn ghost" data-act="reject">Reject, slash</button></div>');
  if (canClaim(j) && me(j.agent)) out.push('<button class="btn ghost" data-act="claim">Claim payment and bond</button>');
  return out.length ? `<div class="act"><span class="h">Take action</span>${out.join("")}</div>` : "";
}
const dataURI = (text) => "data:text/plain;base64," + btoa(unescape(encodeURIComponent(text)));
// A result URI is attacker-controlled: only ever link http(s) and ipfs, never javascript: or other schemes.
function safeHref(uri) {
  if (/^ipfs:\/\//i.test(uri)) return "https://ipfs.io/ipfs/" + uri.slice(7).replace(/^ipfs\//i, "");
  try { const u = new URL(uri); return u.protocol === "https:" || u.protocol === "http:" ? u.href : null; } catch { return null; }
}
const resultLink = (uri) => { if (readURI(uri) != null) return ""; const h = safeHref(uri); return h ? `<a class="clear" href="${esc(h)}" target="_blank" rel="noopener noreferrer">Open</a>` : ""; };
function readURI(uri) { // inline data: URIs are shown as text; anything else is linked
  const m = /^data:([^,]*?)(;base64)?,(.*)$/s.exec(uri || ""); if (!m) return null;
  try { return m[2] ? decodeURIComponent(escape(atob(m[3]))) : decodeURIComponent(m[3]); } catch { return null; }
}

function agentCard(name, description, endpoint) { // ERC-8004 registration file, stored on-chain as a base64 data URI

  return "data:application/json;base64," + btoa(unescape(encodeURIComponent(JSON.stringify(card))));
}

  else if (j.state === "Committed") next = "The judge can confirm to pay the agent or reject to slash it.";
  $("drawer").innerHTML = `<div class="dhead"><h3>Job #${j.id}</h3>${state(j.state)}<button class="x" id="close" aria-label="Close">${svg("x")}</button></div>
    <div class="who" style="margin-bottom:16px">${avatar(j.agentId)}<span class="two"><b><a href="#agent/${j.agentId}" data-close style="text-decoration:none">${esc(a.name)}</a></b><small>${j.state === "Open" ? "Not accepted yet" : short(ckAddr(j.agent))}</small></span></div>${actions(j)}
    <div class="kv"><div><span>Payment</span><b class="num">${fmtMon(j.payment)} MON</b></div><div><span>Bond</span><b class="num">${j.state === "Open" ? "No bond yet" : fmtMon(j.bond) + " MON"}</b></div>
    <div><span>Deadline</span><b>${new Date(j.deadline * 1000).toLocaleString()}</b></div><div><span>Status</span><b>${esc(c.t)}</b></div></div>
    <div class="kv"><div><span>Minimum bond</span><b class="num">${fmtMon(j.minBond)} MON</b></div><div><span>Judge window</span><b>${fmtDur(j.judgeWindow)} after commit</b></div></div>
    <div class="kv"><div><span>Buyer</span><code>${short(ckAddr(j.buyer))}${me(j.buyer) ? " (you)" : ""}</code></div><div><span>Judge</span><code>${short(ckAddr(j.judge))}${me(j.judge) ? " (you)" : ""}</code></div>
    <div><span>Result hash</span><code>${j.resultHash ? short(j.resultHash) : "not committed"}</code></div></div>
    ${j.spec ? `<div class="kv text"><div><span>Task</span></div><p>${esc(j.spec)}</p></div>` : ""}
    ${j.resultURI ? `<div class="kv text"><div><span>Result</span>${resultLink(j.resultURI)}</div><p>${esc(readURI(j.resultURI) ?? j.resultURI)}</p></div>` : ""}
    <div class="next"><b>What happens next</b>${next}</div>`;
  $("drawer").classList.add("on"); $("veil").classList.add("on");
  if (!$("drawer").contains(document.activeElement)) $("close").focus();
}

function render() {
  const VIEWS = { overview, agents, jobs, my: myPage, agent: () => agentPage(S.param) };
  if (!VIEWS[S.view]) S.view = "overview";
  menu(); seedSpans(S.data.jobs);
  $("view").innerHTML = VIEWS[S.view]();
  tick();
  const o = S.open === "hire" || S.open === "agent" ? S.open : S.data.jobs.find((j) => j.id === S.open);
  if (sigOf(o) !== S.sig) drawer(o); // keep typed input: only redraw the drawer when its job actually changed
}
function tick() {
  const n = now();
  document.querySelectorAll("[data-job]").forEach((el) => {
    const j = S.data.jobs[Number(el.dataset.job)]; if (!j) return;
    const c = countdown(j, n);
    el.querySelector(".due").innerHTML = c.late ? `<span class="flag">LATE · ${c.t.replace(" late", "")}</span>` : (c.f || esc(c.t));
  });
}

function route() {
  const [v, p] = location.hash.slice(1).split("/");
  S.view = v || "overview"; S.param = p != null ? Number(p) : null; S.open = null; render();
  if (S.view === "agent" && Number.isFinite(S.param) && !S.meta[S.param]) { S.extra.includes(S.param) || S.extra.push(S.param); ensureMeta(); }
}
addEventListener("hashchange", route);
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-open],[data-filter],[data-role],[data-tpl],[data-nav],[data-close],#veil,#close");
  if (!t) return;
  if (t.dataset.act) return act(t.dataset.act, t);
  if (t.dataset.nav) { location.hash = t.dataset.nav; return; }
  if (t.dataset.open != null) { S.open = Number(t.dataset.open); drawer(S.data.jobs[S.open]); }
  else if (t.dataset.filter) { S.filter = t.dataset.filter; render(); }
  else if (t.dataset.role) { S.role = t.dataset.role; render(); }
  else if (t.dataset.tpl != null) { const el = $("f-spec"); if (el) { el.value = TEMPLATES[Number(t.dataset.tpl)][1]; updateHire(); } }
  else { S.open = null; drawer(null); }
});
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.open != null) { S.open = null; drawer(null); }
  if (e.key === "Enter" && e.target.matches?.("[data-nav]")) location.hash = e.target.dataset.nav;
  if (e.key === "Enter" && e.target.id === "f-find") act("lookup", e.target);
});
$("drawer").addEventListener("input", (e) => { if (e.target.id === "f-minbond") e.target.dataset.touched = "1"; if ($("hire-sum")) updateHire(); });
$("drawer").addEventListener("change", () => { if ($("hire-sum")) updateHire(); });

async function act(a, btn) {
  const j = S.data.jobs.find((x) => x.id === S.open), v = (id) => ($(id)?.value || "").trim();
  try {
    if (a === "connect") return connect();
    if (a === "withdraw") return send("Withdraw", (c) => c.withdraw(), btn);
    if (a === "newagent") { if (!W.signer) await connect(); if (!W.signer) return; S.open = "agent"; return drawer("agent"); }
    if (a === "hire") {
      if (!W.signer) await connect(); if (!W.signer) return;
      S.hireAgent = btn.dataset.agent != null ? Number(btn.dataset.agent) : S.hireAgent; S.open = "hire"; return drawer("hire");
    }
    if (a === "lookup") {
      const id = Number(v("f-find")); if (!Number.isInteger(id) || id < 0) return toast("Enter an agent ID, for example 2132.", true);
      const m = await P.agentMeta(id, { fresh: true });
      if (!m.ok) return toast(`Agent #${id} is not registered on the ERC-8004 Identity Registry.`, true);
      S.meta[id] = m; if (!universe().includes(id)) S.extra.push(id);
      if (!S.data.agents.some((x) => x.id === id)) S.stats[id] = await P.agentStats(id);
      location.hash = "#agent/" + id; return;
    }
    if (a === "register") {
      const name = v("f-name"); if (!name) return toast("Give the agent a name.", true);
      if (!W.signer) return connect();
      const reg = new ethers.Contract(CFG.IDENTITY, IDENTITY_ABI, W.signer);
      btn.disabled = true;
      try {
        toast("Register agent: confirm in your wallet");
        const tx = await reg.register(agentCard(name, v("f-desc"), v("f-endpoint")));
        toast(`Register agent: sent <code>${short(tx.hash)}</code>`);
        const r = await tx.wait();
        const ev = r.logs.map((l) => { try { return reg.interface.parseLog(l); } catch { return null; } }).find((e) => e?.name === "Transfer");
        const id = Number(ev.args.tokenId);
        saveMine(id); if (!S.extra.includes(id)) S.extra.push(id); S.hireAgent = id;
        toast(`Agent #${id} registered on ERC-8004`);
        $("drawer").querySelector(".act").innerHTML = `<span class="h">${esc(name)} is live (#${id})</span>
          <p class="k" style="margin:0;font-size:14px;line-height:1.5">It can now be hired. To make it do the work, run it with the Pledge SDK and list the judges you trust:</p>
          <div class="next" style="margin:0"><code style="margin:0">pledge.serve(${id}, handler, { trustedJudges: [...] })</code></div>
          <button class="btn" data-act="hire" data-agent="${id}">Post a job for it</button><a class="btn ghost" href="#agent/${id}" data-close>View profile</a>`;
        ensureMeta(); render();
      } catch (e) { toast("Register agent failed: " + esc(e.shortMessage || e.message), true); btn.disabled = false; }
      return;
    }
    if (a === "create") {
      const h = hireValues(), spec = h.spec;
      if (!/^\d+$/.test(h.agentId)) return toast("Choose an agent, or enter its ERC-8004 ID.", true);
      if (!spec) return toast("Describe the task for the agent.", true);
      if (!ethers.isAddress(h.judge)) return toast("Enter a valid judge address.", true);
      let value, minBond;
      try { value = ethers.parseEther(h.pay); minBond = ethers.parseEther(h.minBond || "0"); } catch { return toast("Check the payment and minimum bond amounts.", true); }
      if (value <= 0n) return toast("The payment must be above 0.", true);
      const m = S.meta[h.agentId] || await P.agentMeta(h.agentId);
      if (!m.ok) return toast(`Agent #${h.agentId} is not registered on ERC-8004.`, true);
      S.meta[h.agentId] = m;
      const r = await send("Create job", (c) => c.create(BigInt(h.agentId), h.judge, now() + h.mins * 60, minBond, h.jwin * 60, spec, { value }), btn);
      if (r) { S.view = "my"; S.param = null; history.replaceState(null, "", location.search + "#my"); S.open = S.data.jobs.length - 1; render(); drawer(S.data.jobs[S.open]); }
      return;
    }
    if (!j) return;
    if (a === "accept") return send(`Accept job #${j.id}`, (c) => c.accept(j.id, { value: ethers.parseEther(v("f-bond")) }), btn);
    if (a === "commit") { const res = v("f-result"); return send(`Commit job #${j.id}`, (c) => c.commit(j.id, ethers.keccak256(ethers.toUtf8Bytes(res)), dataURI(res)), btn); }
    if (["cancel", "slash", "confirm", "reject", "claim"].includes(a)) return send(`${a[0].toUpperCase() + a.slice(1)} job #${j.id}`, (c) => c[a](j.id), btn);
  } catch (e) { toast(esc(e.shortMessage || e.message), true); }
}

(async () => {
  const [v, p] = location.hash.slice(1).split("/"); S.view = v || "overview"; S.param = p != null ? Number(p) : null;
  try {
    S.data = await load(); render(); setInterval(tick, 1000);
    if (S.view === "agent" && Number.isFinite(S.param)) S.extra.push(S.param);
    ensureMeta();
    if (CFG.ADDRESS) setInterval(() => refresh().catch(() => {}), 8000);
    // Keep the open job in step with the chain: one cheap read every 2 s while it can still change.
    if (CFG.ADDRESS) setInterval(async () => {
      const j = S.data.jobs.find((x) => x.id === S.open);
      if (!j || !["Open", "Active", "Committed"].includes(j.state)) return;
      try {
        const fresh = await P.loadJob(j.id);
        if (fresh.state !== j.state || fresh.resultHash !== j.resultHash) { S.data.jobs[j.id] = fresh; render(); }
      } catch {}
    }, 2000);
    // Follow account switches in the wallet (e.g. MetaMask) without a reload.
    window.ethereum?.on?.("accountsChanged", (accs) => { if (W.addr) { W.signer = null; W.addr = null; W.credit = 0n; S.mine = []; if (accs && accs.length) connect(); else render(); } });
  } catch (e) { $("view").innerHTML = `<div class="panel"><div class="empty">Failed to load: ${esc(e.message)}</div></div>`; }
})();
</script>
</body>
</html>
